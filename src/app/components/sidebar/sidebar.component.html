<aside class="sidebar" [class.mobile-open]="menuOpen()">
  <div class="sidebar-header">
    <div class="identity">
      <h1 class="name">David Byrne</h1>
      <h2 class="title">Software Engineer &amp; Web Application Developer</h2>
      <p class="tagline">Building modern websites and software solutions for businesses.</p>
      <div class="sidebar-photo">
        <img src="david-byrne.png" alt="David Byrne" class="photo">
      </div>
    </div>

    <button class="mobile-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation">
      <span class="hamburger" [class.open]="menuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
  </div>

  <nav class="nav" [class.nav-open]="menuOpen()">
    @for (item of navItems; track item.route) {
      <a class="nav-link"
         [routerLink]="item.route"
         routerLinkActive="active"
         (click)="closeMobileMenu()">
        <span class="nav-line"></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="social-links" [class.social-open]="menuOpen()">
    <app-social-links />
  </div>
</aside>
